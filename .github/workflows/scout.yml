name: Scout RemoteOK

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan scout agent
        run: python scout_remoteok.py

      - name: Commit task_pool.json kalau ada perubahan
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add task_pool.json
          git diff --quiet --cached || git commit -m "Update task pool $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
